# Hostinger VPS — active nginx config for Docker-backed PaintPWA
# Install:
#   sudo cp docker/nginx/paintappstore.conf /etc/nginx/sites-available/paintappstore.conf
#   sudo ln -sf /etc/nginx/sites-available/paintappstore.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # if unused
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (once DNS points here):
#   sudo certbot --nginx -d paintappstore.in -d www.paintappstore.in \
#     -d app.paintappstore.in -d api.paintappstore.in

# --- Marketing: paintappstore.in ---
server {
    listen 80;
    server_name paintappstore.in www.paintappstore.in;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- ERP app: app.paintappstore.in (client container proxies /api → server) ---
server {
    listen 80;
    server_name app.paintappstore.in;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- Direct API: api.paintappstore.in (optional; mobile/tools) ---
server {
    listen 80;
    server_name api.paintappstore.in;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
