# Host nginx → Docker (PaintPWA production)
#
# Install:
#   sudo cp docker/nginx/paintappstore.conf /etc/nginx/sites-available/paintappstore.conf
#   sudo ln -sf /etc/nginx/sites-available/paintappstore.conf /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   # Remove OLD paint configs if present (paint-v2, old paintappstore files)
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL (if not already configured):
#   sudo certbot --nginx -d paintappstore.in -d www.paintappstore.in \
#     -d app.paintappstore.in -d api.paintappstore.in
#
# Cert path: certbot usually stores multi-domain certs under the first -d name.
# If nginx -t fails on ssl_certificate, check:
#   sudo ls /etc/letsencrypt/live/

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- ERP app: app.paintappstore.in → Docker client :8080 ---
server {
    listen 80;
    listen 443 ssl http2;
    server_name app.paintappstore.in;

    ssl_certificate     /etc/letsencrypt/live/paintappstore.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/paintappstore.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

# --- Marketing: paintappstore.in → Docker marketing :3000 ---
