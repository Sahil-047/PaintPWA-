# Local dev — MongoDB only. For full stack see docker-compose.prod.yml
services:
  mongodb:
    image: mongo:7
    container_name: paint-saas-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: paint-saas

volumes:
  mongo_data:
